name: Build U-Boot

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          bc \
          libssl-dev \
          swig \
          python3-dev \
          python3-pip \
          libncurses-dev \
          flex \
          bison

    - name: Purge conflicting libfdt packages
      run: |
        # This prevents binman from crashing with the QUIET_NOTFOUND error
        pip uninstall -y libfdt || true
        sudo apt-get remove -y python3-libfdt || true

    - name: Configure and Build U-Boot
      run: |
        # Clean previous artifacts
        make mrproper
        
        # Load your board config (change grouper_defconfig if your target is different)
        make grouper_defconfig
        
        # Compile using all available runner cores
        make -j$(nproc)
