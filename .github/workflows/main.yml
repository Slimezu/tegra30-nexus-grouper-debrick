name: Build U-Boot for Grouper

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies & ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          bc \
          libssl-dev \
          swig \
          python3-dev \
          python3-pip \
          libncurses-dev \
          flex \
          bison \
          gcc-arm-none-eabi

    - name: Purge conflicting libfdt packages
      run: |
        # Prevents binman from crashing on QUIET_NOTFOUND
        pip uninstall -y libfdt || true
        sudo apt-get remove -y python3-libfdt || true

    - name: Configure and Build U-Boot
      run: |
        # Clean up any leftover artifacts
        make mrproper
        
        # Configure for Grouper using the ARM cross-compiler
        make ARCH=arm CROSS_COMPILE=arm-none-eabi- grouper_defconfig
        
        # Build the actual binary using all runner cores
        make ARCH=arm CROSS_COMPILE=arm-none-eabi- -j$(nproc)

    - name: Upload U-Boot Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-dtb-tegra
        path: |
          u-boot-dtb-tegra.bin
          u-boot.bin
          spl/u-boot-spl.bin
