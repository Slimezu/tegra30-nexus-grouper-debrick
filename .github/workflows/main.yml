name: Build U-Boot

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make bison flex libssl-dev python3 bc swig libgnutls28-dev uuid-dev libncurses-dev

      - name: Build U-Boot for Grouper
        run: |
          make ARCH=arm CROSS_COMPILE=arm-none-eabi- grouper_defconfig
          make ARCH=arm CROSS_COMPILE=arm-none-eabi- NO_PYTHON=1 -j$(nproc)

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-dtb-tegra
          path: u-boot-dtb-tegra.bin
